<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayDost Islamabad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gold-bg { background-color: #D4AF37; }
        .gold-text { color: #D4AF37; }
        .navy-bg { background-color: #0A192F; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-12">
    <nav class="navy-bg text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid font-bold fa-hotel gold-text"></i> StayDost <span class="text-xs gold-bg text-black px-2 py-0.5 rounded font-semibold">ISB</span>
            </h1>
            <button onclick="toggleAdmin()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-600 gold-text">
                <i class="fa-solid fa-user-gear mr-1"></i> Admin
            </button>
        </div>
    </nav>

    <div class="max-w-xl mx-auto p-4">
        <div class="navy-bg text-white rounded-2xl p-6 mb-6 shadow-xl relative overflow-hidden">
            <h2 class="text-2xl font-bold mb-1">Find Hotels in Islamabad</h2>
            <p class="text-xs text-slate-300 mb-4">Book verified stays with local support</p>
            <div class="space-y-3">
                <input type="text" id="searchInput" placeholder="Search Sector (e.g. F-7, F-8, Blue Area)" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:border-yellow-500">
                <button onclick="renderHotels()" class="w-full gold-bg text-slate-900 font-bold p-3 rounded-lg text-sm hover:opacity-90">Search Hotels</button>
            </div>
        </div>

        <div id="adminPanel" class="hidden bg-white p-5 rounded-2xl shadow-lg border border-slate-200 mb-6">
            <h3 class="font-bold text-lg navy-bg text-white p-3 rounded-xl mb-4 flex justify-between items-center">
                <span>Admin Dashboard</span>
                <span class="text-xs gold-text">Live Controls</span>
            </h3>
            <form onsubmit="addHotel(event)" class="space-y-3 mb-6">
                <p class="text-xs font-semibold text-slate-600">Add / Update Room Listing</p>
                <input type="text" id="hName" placeholder="Hotel Name" class="w-full p-2.5 border rounded-lg text-sm" required>
                <input type="text" id="hArea" placeholder="Area (e.g. F-7/2)" class="w-full p-2.5 border rounded-lg text-sm" required>
                <input type="number" id="hPrice" placeholder="Price per Night (PKR)" class="w-full p-2.5 border rounded-lg text-sm" required>
                <input type="url" id="hImg" placeholder="Room Photo URL (Image Link)" class="w-full p-2.5 border rounded-lg text-sm" required>
                <button type="submit" class="w-full navy-bg text-white py-2.5 rounded-lg text-sm font-bold">Add / Update Hotel</button>
            </form>
            <div class="border-t pt-4">
                <h4 class="font-bold text-sm mb-2">Booking Requests</h4>
                <div id="requestsList" class="space-y-2 text-xs text-slate-600">No pending requests.</div>
            </div>
        </div>

        <h3 class="font-bold text-slate-800 text-lg mb-4">Available Rooms</h3>
        <div id="hotelList" class="space-y-4"></div>
    </div>

    <script>
        let hotels = JSON.parse(localStorage.getItem('sd_hotels')) || [
            { id: 1, name: "Serena View Executive", area: "F-7/2, Islamabad", price: 12000, img: "https://images.unsplash.com/photo-1590490360182-c33d57733427?w=500" },
            { id: 2, name: "Margalla Residency", area: "F-8/3, Islamabad", price: 8500, img: "https://images.unsplash.com/photo-1566665797739-1674de7a421a?w=500" }
        ];
        let requests = JSON.parse(localStorage.getItem('sd_reqs')) || [];

        function save() {
            localStorage.setItem('sd_hotels', JSON.stringify(hotels));
            localStorage.setItem('sd_reqs', JSON.stringify(requests));
        }

        function renderHotels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('hotelList');
            list.innerHTML = '';
            hotels.filter(h => h.name.toLowerCase().includes(query) || h.area.toLowerCase().includes(query)).forEach(h => {
                list.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-md border border-slate-100">
                        <img src="${h.img}" class="w-full h-44 object-cover">
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="font-bold text-slate-800 text-base">${h.name}</h4>
                                    <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot gold-text mr-1"></i>${h.area}</p>
                                </div>
                                <span class="navy-bg text-white text-xs font-bold px-2.5 py-1 rounded-full">Rs. ${h.price.toLocaleString()}</span>
                            </div>
                            <button onclick="bookRoom('${h.name}')" class="w-full mt-2 gold-bg text-slate-900 font-bold py-2 rounded-lg text-xs hover:opacity-90">Book Now</button>
                        </div>
                    </div>`;
            });
        }

        function toggleAdmin() {
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderReqs();
        }

        function addHotel(e) {
            e.preventDefault();
            hotels.push({
                id: Date.now(),
                name: document.getElementById('hName').value,
                area: document.getElementById('hArea').value,
                price: Number(document.getElementById('hPrice').value),
                img: document.getElementById('hImg').value
            });
            save(); renderHotels();
            e.target.reset();
            alert('Hotel added successfully!');
        }

        function bookRoom(name) {
            const phone = prompt("Enter your Mobile Number for Booking:");
            if(phone) {
                requests.push({ name, phone, date: new Date().toLocaleDateString() });
                save();
                alert("Booking Request Sent!");
            }
        }

        function renderReqs() {
            const el = document.getElementById('requestsList');
            el.innerHTML = requests.length ? requests.map(r => `<div class="p-2 bg-slate-100 rounded flex justify-between"><span>${r.name} - ${r.phone}</span><span class="text-slate-400">${r.date}</span></div>`).join('') : 'No pending requests.';
        }

        renderHotels();
    </script>
</body>
</html>
